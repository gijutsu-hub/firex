<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FireX Console</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<!-- Icons are defined once and referenced with <use>. An appliance console
     has to render on a machine that has never reached the internet, so no
     icon font and no emoji: emoji are drawn by the operating system, which
     means the same console looks different on every workstation and shows
     a dotted box on the ones with no colour font installed. -->
<svg class="icon-defs" aria-hidden="true">
  <defs>
    <g id="i-dash"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></g>
    <g id="i-port"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M8 7V5m4 2V5m4 2V5"/></g>
    <g id="i-seg"><path d="M12 3v7m0 0L5 17m7-7l7 7"/><circle cx="12" cy="3" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></g>
    <g id="i-wan"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></g>
    <g id="i-vpn"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></g>
    <g id="i-policy"><path d="M5 4h14v16l-7-4-7 4z"/></g>
    <g id="i-portal"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0114 0"/></g>
    <g id="i-threat"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></g>
    <g id="i-malware"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10l2 2M19 5l-2 2M7 17l-2 2"/></g>
    <g id="i-airgap"><path d="M4 7h6M14 7h6M4 17h6M14 17h6"/><path d="M10 3v18M14 3v18" stroke-dasharray="3 3"/></g>
    <g id="i-monitor"><path d="M3 17l5-6 4 4 4-7 5 9"/></g>
    <g id="i-diag"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></g>
    <g id="i-events"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></g>
    <g id="i-config"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="17" r="2"/></g>
    <g id="i-audit"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h4"/></g>
    <g id="i-system"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10l2.1 2.1m0-14.2l-2.1 2.1M7 17l-2.1 2.1"/></g>
  </defs>
</svg>

<div class="shell">

  <aside class="side" id="side">
    <div class="side-brand">
      <span class="mark" aria-hidden="true">
        <!-- The flame, as a path rather than an image: it has to render
             before any asset has loaded and at any zoom. -->
        <svg viewBox="0 0 32 40" width="26" height="32">
          <path d="M16 1C16 1 5 12.5 5 23a11 11 0 0022 0C27 12.5 16 1 16 1z" fill="url(#flame)"/>
          <path d="M16 13c0 0-5 5.6-5 10.4a5 5 0 1010 0C21 18.6 16 13 16 13z" fill="#7E1D22"/>
          <defs><linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FF6A4D"/><stop offset="1" stop-color="#FF2D55"/>
          </linearGradient></defs>
        </svg>
      </span>
      <!-- Filled from /api/system at sign-in. Hard-coding the names here
           is what made "brand.h is the only file a re-skin edits" untrue:
           a re-skin had to remember this file too, and nothing failed if
           it did not. -->
      <span class="side-names">
        <span class="n1" id="brand-product">FireX</span>
        <span class="n2" id="brand-vendor">&nbsp;</span>
      </span>
    </div>

    <nav id="nav" aria-label="Console sections"></nav>

    <div class="side-foot">
      <div class="sf-row"><span>Version</span><b id="sf-version">&mdash;</b></div>
      <div class="sf-row"><span>Uptime</span><b id="sf-uptime">&mdash;</b></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="side-toggle" id="side-toggle" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="crumb">
        <h1 id="page-title">Dashboard</h1>
        <p id="page-sub" class="crumb-sub"></p>
      </div>

      <div class="sysbar" id="sysbar"></div>

      <div class="session">
        <!-- How this page arrived, and whether anything applied is still
             only in memory. Both are states the operator has no other way
             to see, and both were invisible before. -->
        <span id="tls-state" class="conn" title=""></span>
        <span id="unsaved" class="unsaved" style="display:none"></span>
        <span id="configbar" class="configbar"></span>
        <span id="whoami" class="whoami"></span>
        <button class="mini ghost" id="btn-logout" style="display:none">Sign out</button>
      </div>
    </header>

    <main id="content"><p class="muted">Loading&hellip;</p></main>
  </div>

</div>

<script src="/ui/vlan.js"></script>
</body>
</html>
