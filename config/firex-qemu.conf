# ==============================================================
#   FireX - minimal two-interface config for QEMU / lab testing
#
#   eth0  WAN  (user-mode networking, DHCP)
#   eth1  LAN  trunk carrying VLAN 10 (CORP) and VLAN 30 (GUEST)
#
#   Use with:  firexd -c /etc/firex/firex-qemu.conf
# ==============================================================

[system]
hostname         = firex-lab
organisation     = FireX Lab
domain           = lab.local
# Left empty, the block page falls back to BRAND_SUPPORT_EMAIL in
# include/brand.h. Set it here to send this site's access requests to
# its own mailbox instead. If both are empty the page omits the
# "Contact Security Team" button rather than offering a dead mailto:
# to a user who is already blocked.
admin_contact    =
[wan:0]
interface        = eth0
mode             = dhcp
mtu              = 1500
nat              = yes
block_private_in = no          ; QEMU user-net hands out RFC1918 addresses
block_bogons     = yes
respond_to_ping  = no

[port:eth0]
label            = WAN
mode             = access
zone             = WAN
pvid             = 0
enabled          = yes

[port:eth1]
label            = LAN-TRUNK
mode             = trunk
zone             = LAN
pvid             = 1
allowed_vlans    = 10,30
drop_untagged    = no
enabled          = yes

[vlan:10]
name                = CORP
description         = Lab corporate segment
zone                = LAN
subnet              = 10.10.10.0
netmask             = 255.255.255.0
gateway             = 10.10.10.1
dhcp                = yes
dhcp_start          = 10.10.10.100
dhcp_end            = 10.10.10.200
inter_vlan_routing  = yes
internet_access     = yes
dpi                 = yes

[vlan:30]
name                = GUEST
description         = Lab guest segment - isolated, internet only
zone                = GUEST
subnet              = 10.10.30.0
netmask             = 255.255.255.0
gateway             = 10.10.30.1
dhcp                = yes
dhcp_start          = 10.10.30.100
dhcp_end            = 10.10.30.200
inter_vlan_routing  = no
internet_access     = yes
client_isolation    = yes
captive_portal      = yes
show_block_page     = yes
dpi                 = yes

[zones]
zone_policy = LAN   WAN    ALLOW
zone_policy = GUEST WAN    LOG_ALLOW
zone_policy = GUEST LAN    LOG_DENY
zone_policy = WAN   LAN    DENY
zone_policy = WAN   GUEST  DENY

[acl]
rule = 30 -> 10  *   *   DENY  5  "GUEST cannot reach CORP"

[blockpage]
enabled          = yes
port             = 8080
org_name         = FireX Lab
admin_contact    =
allow_override   = yes
show_logo        = yes
