# FlameWall Configuration
# Edit this file or use the GUI (Rules -> Save writes it back).

[settings]
default_policy=ALLOW
interface=eth0
engine=0
log_to_file=1
log_file=flamewall.log

[rule]
enabled=1
type=RATE_LIMIT
action=RATE_LIMIT
priority=5
max_pps=1000
max_bps=10000000
description=DDoS Protection (1000 pps limit)

[rule]
enabled=1
type=PROTOCOL
action=BLOCK
priority=10
protocol=1
description=Block ICMP Ping

[rule]
enabled=1
type=PORT_DST
action=BLOCK
priority=20
port=23
description=Block Telnet

[rule]
enabled=1
type=PORT_DST
action=BLOCK
priority=30
port=21
description=Block FTP

[rule]
enabled=1
type=DPI_REGEX
action=BLOCK
priority=50
regex=(SELECT|UNION|INSERT|DELETE|DROP).*FROM
description=Block SQL Injection

[rule]
enabled=1
type=DPI_REGEX
action=BLOCK
priority=51
regex=<script[^>]*>|javascript:|on(load|click|error)=
description=Block XSS Attacks
