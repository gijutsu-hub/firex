# ── Observability ───────────────────────────────────────────
# Block events are shipped as RFC 5424 syslog; connection flows as NetFlow
# v5. Leave a host empty to disable that exporter. history_interval controls
# the in-memory counter ring the console charts (1440 slots, so 30s gives
# twelve hours).
# ── Traffic shaping ─────────────────────────────────────────
# HTB enforces the rate limits; FQ-CoDel underneath is what keeps the link
# responsive while it is saturated. The rate limit is what people ask for;
# the leaf qdisc is what they actually notice.
#
# Upload is shaped on the WAN interface and classified by source subnet, so
# each VLAN gets its own class under one ceiling. Download to a VLAN's
# clients is shaped on that VLAN's own interface. Total download can only be
# shaped by redirecting WAN ingress to an IFB device, which costs a copy of
# every inbound packet -- hence opt-in.
[shaping]
enabled           = yes
wan_up_mbps       = 100
wan_down_mbps     = 500
qdisc             = fq_codel
codel_target_ms   = 5
codel_interval_ms = 100
ecn               = yes
ingress_shaping   = no

# ── Captive portal ──────────────────────────────────────────
# Clients on a VLAN with captive_portal=yes are intercepted until they
# authenticate. The rule matches on a client NOT being in the authenticated
# set, so a bug in the session code fails closed.
#
# auth = click | voucher | radius
#   click    accept the terms and continue
#   voucher  a printed code, generated from the console
#   radius   an organisation account, PAP over RFC 2865
[portal]
enabled           = yes
auth              = voucher
session_minutes   = 240
idle_minutes      = 30
terms             = "Access is provided for legitimate business and guest use. Traffic is filtered and logged. Do not use this network to transmit unlawful material or to attempt to reach systems you are not authorised to use."
nas_id            = firex-hq

# ── High availability ───────────────────────────────────────
# Two appliances, one carrying traffic. Three things have to be true for a
# failover to be invisible: the gateway addresses move (VRRP), established
# connections survive (conntrackd), and both nodes agree on the config
# (replication, authenticated by sync_secret below).
#
# Shipped disabled. Enabling it changes who owns the VLAN gateway addresses:
# they become virtual and keepalived assigns them, so a single node with HA
# on and keepalived absent has no gateways at all. Turn this on only when
# both nodes and keepalived are actually in place.
#
# The sync link should be a dedicated segment the two nodes share -- MGMT
# here. Each node needs its own address on it, distinct from the VLAN
# gateway that VRRP will move.
[ha]
enabled          = no
role             = primary
peer_address     = 10.10.99.3
sync_address     = 10.10.99.2
sync_interface   = eth1.99
vrrp_id          = 51
vrrp_password    = fxvrrp01
priority         = 150
advert_interval  = 1
preempt          = yes
conntrack_sync   = yes
conntrack_port   = 3780
config_sync      = yes
config_sync_port = 8080
sync_secret      = 2CpJS+Tln0S51vpfgBg2OLQphzZAr9knMtwJ1HMPtlE=

# ── Threat layer ────────────────────────────────────────────
# Signature matching, blocklist feeds and automatic response. A VLAN only
# reaches the signature engine if it sets ips or malware_scan -- with ips
# the whole ruleset applies, with malware_scan only the malware and C2
# classes do.
#
# inline = no means drop rules report and let traffic through. That is how a
# new ruleset should be deployed: watch what it would have blocked for a
# week, then turn it on.
[threat]
enabled       = yes
inline        = no
rules         = /etc/firex/rules.ids
feeds_enabled = yes

# ── Administration console listener ───────────────────────────────────
#
# The console gets its OWN socket, separate from the block page.
#
# That is not tidiness. The block page has to face the untrusted segments
# -- it is what a quarantined host is redirected to -- while the console
# must never. Sharing one listener meant one bind and one exposure, and a
# host on GUEST could reach the login page of the appliance that was
# quarantining it.
#
# bind takes an address, "mgmt" for the management zone's gateway, or
# "any". The daemon refuses to start if the two listeners would land on
# the same socket, rather than silently collapsing back into one.
#
# TLS is not terminated here yet: 8443 is the conventional number for an
# admin interface, not a promise that this one is encrypted. Put it on a
# management VLAN and reach it over a VPN until that lands.
[console]
port = 8443
bind = mgmt

# TLS on the management console.
#
# On by default -- this line only has to be here to turn it OFF, which you
# should only do when something in front of the appliance is already
# terminating TLS for it.
#
# The certificate is NOT in the image. A certificate baked into an image is
# one that every appliance built from that image shares, which is a private
# key an attacker already has. It is generated on the first start instead,
# self-signed, and its SHA-256 fingerprint is printed to the console log and
# shown on the System page -- compare it once, accept the browser warning
# once, and the identity stays the same across restarts and updates.
#
# Point tls_cert and tls_key at your own PEM files to use a certificate
# signed by an internal CA, which removes the warning entirely.
tls      = yes
# tls_cert = /etc/firex/console.crt
# tls_key  = /etc/firex/console.key

# ── Live malware protection ───────────────────────────────────────────
#
# [threat] above matches signatures inside a single packet. This follows
# a transfer across packets instead, assembles the object and identifies
# the finished file -- which is what catches a download whose signature
# straddles a segment boundary.
#
# It ships in detect-only mode on purpose. A scanner that starts dropping
# traffic the first time it is switched on, before anyone has seen what
# it matches on this network, is a scanner that gets switched off again.
# Watch the Detections list for a few days, then set block = yes.
[malware]
enabled       = yes
block         = no
scan_uploads  = no

# Objects larger than this are hashed only as far as the cap and marked
# truncated, rather than being buffered without limit. Reassembly is
# attacker-reachable memory, so it has a ceiling.
max_object_kb = 512

# A flow with no packets for this long is abandoned and its buffer freed.
flow_idle     = 30

# Hash database: one record per line, "<sha256> <severity 1-4> <name>".
# Absent or unreadable leaves the built-in byte patterns running, which
# include the EICAR test file so the scanner can be proved alive.
database      = /etc/firex/malware.db

# ── Air gap ───────────────────────────────────────────────────────────
#
#   connected      normal operation
#   scheduled      shut except inside the windows below
#   inbound-only   a data diode pointing in: may receive, may never send
#   outbound-only  the diode reversed
#   isolated       nothing crosses the boundary either way
#   manual         isolated, AND the appliance fetches nothing of its own
#
# The difference between isolated and manual is the one that matters. An
# appliance that blocks all user traffic but still reaches out for its
# own updates is not air-gapped: it is a firewall with one sanctioned
# tunnel through it, and that tunnel is the most valuable target on the
# network. In manual mode, signatures and updates are carried in by hand.
[airgap]
mode              = connected

# A scheduled gap is decided entirely by the local clock, so an appliance
# that boots with a bad clock would otherwise pick a window at random.
# With this set it stays shut until the time can be trusted.
require_time_sync = yes
log_denied        = yes

# window = name,days,HH:MM,HH:MM,inbound,outbound
#
# days is a seven-character mask starting Sunday, so it reads the way a
# weekly schedule is drawn: "-MTWTF-" is the working week. A window whose
# end is before its start wraps midnight and belongs to the day it STARTS
# on, so an overnight window runs into the next morning.
#
# Uncomment to sync for two hours every weeknight and stay shut otherwise:
# window          = nightly-sync,-MTWTF-,02:00,04:00,1,1

# A feed is a list of addresses or domains, refetched on a schedule. HTTPS
# certificates are verified: a blocklist an attacker can rewrite is worse
# than no blocklist. A failed fetch keeps the previous list rather than
# emptying it.
[feed:local-blocklist]
kind    = ip
url     = file:///etc/firex/blocklist.txt
refresh = 60
enabled = yes

# ── Automatic response ──────────────────────────────────────
# Detections accumulate a score; a host is acted on at the threshold, held
# longer each time it returns, and decays back to nothing while quiet. A
# severity-4 hit reaches the default threshold on its own; a severity-1 hit
# needs ten.
#
# quarantine moves the host into ZONE_QUARANTINE, so what it may still reach
# is decided by the zone matrix above rather than hardcoded here.
[response]
enabled           = yes
threshold         = 10
block_minutes     = 15
escalate          = yes
max_block_minutes = 1440
decay_minutes     = 60
quarantine        = yes
notify            = yes

[telemetry]
syslog_host         = 10.10.20.50
syslog_port         = 514
syslog_proto        = udp
syslog_facility     = 16
syslog_min_severity = 6
netflow_host        = 10.10.20.51
netflow_port        = 2055
netflow_interval    = 60
history_interval    = 30

[blockpage]
