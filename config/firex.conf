# ── Gateway monitoring ──────────────────────────────────────
# Each WAN is probed with ICMP. A link has to miss three probes in a row
# before the default route moves, and reply twice in a row before it comes
# back, so a single lost packet never flaps the route.
[monitor]
interval       = 5
timeout_ms     = 1000
fail_threshold = 3
ok_threshold   = 2

